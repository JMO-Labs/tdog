name: wq-ci
on:
  pull_request: {branches: [dev]}
  push: {branches: [dev]}
permissions: {contents: read, pull-requests: write}
jobs:
  # Docs-only changes skip the gate (skipped = success).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read}
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            code: ['cmd/**', 'internal/**', 'web/**', 'scripts/**', 'go.mod', 'go.sum', '.github/workflows/wq-ci.yml']
  wq:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: JMO-Labs/wq-ci/.github/workflows/wq-ci.yml@v1
    with:
      reruns: 1
      test-cmd: ./scripts/test.sh
      fix-cmd: gofmt -w cmd internal && cd web && npm ci --silent && npx prettier --write .
    secrets: inherit
