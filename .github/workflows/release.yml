name: release
on:
  push: {branches: [main]}
permissions: {contents: write, issues: write, pull-requests: write, packages: write}
concurrency: {group: release, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - id: sr
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          npx --yes semantic-release@24
          tag=$(git tag --points-at HEAD 'v*' | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.sr.outputs.tag != ''
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - if: steps.sr.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/jmo-labs/tdog:${{ steps.sr.outputs.tag }},ghcr.io/jmo-labs/tdog:latest
